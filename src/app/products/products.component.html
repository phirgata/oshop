<div class="container">
  <div class="row">
    <div class="col-3">
      <product-filter [category]="category"></product-filter>
    </div>
    <div class="col" *ngIf="cart$ | async as cart">
      <ng-container *ngFor="let p of filteredProducts as products; let i = index; even as isEven">
        <div *ngIf="isEven" class="row">
          <div class="col">
            <product-card [product]="p" [shopping-cart]="cart"></product-card>
          </div>
          <div class="col">
            <product-card *ngIf="products.length - 1 > i" [product]="products[i+1]" [shopping-cart]="cart"></product-card>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
