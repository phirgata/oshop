<p>
  <a routerLink="/admin/products/new" class="btn btn-primary">New Product</a>
</p>
<p>
  <input #query (keyup)="filter(query.value)" type="text" class="form-control" placeholder="Search...">
</p>

<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 resizable-table">
  <ng-container matColumnDef="position">
    <th mat-header-cell *matHeaderCellDef appColumnResize></th>
    <td mat-cell *matCellDef="let p"> {{ p.position }} </td>
  </ng-container>
  <ng-container matColumnDef="title">
    <th
      #titleHeader
      mat-header-cell
     *matHeaderCellDef
      mat-sort-header
      appColumnResize>Title</th>
    <td mat-cell *matCellDef="let p"> {{ p.title }} </td>
  </ng-container>
  <ng-container matColumnDef="price">
    <th
      #priceHeader
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      appColumnResize>Price</th>
    <td mat-cell *matCellDef="let p"> {{ p.price | currency:'USD':"symbol" }} </td>
  </ng-container>
  <ng-container matColumnDef="edit">
    <th mat-header-cell *matHeaderCellDef appColumnResize></th>
    <td mat-cell *matCellDef="let p"> <a [routerLink]="['/admin/products/', p.key]">Edit</a> </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
  <tr mat-row *matRowDef="let row; columns: columnsToDisplay;"></tr>
</table>
<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons [pageSize]="10"></mat-paginator>
